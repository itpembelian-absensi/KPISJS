name: Deploy KPISJS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: [self-hosted, kpisjs]

    steps:
      - name: Run Deployment Script
        run: |
          cd /srv/docker/KPISJS
          git fetch origin master
          git checkout origin/master -- deploy.sh
          chmod +x deploy.sh
          ./deploy.sh
